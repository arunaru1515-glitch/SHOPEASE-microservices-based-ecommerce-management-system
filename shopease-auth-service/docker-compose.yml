version: "3.8"

services:
  auth-db:
    image: mysql:8.0
    container_name: shopease-auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-shopease_password}
      MYSQL_DATABASE: ${DB_NAME:-shopease_auth_db}
      MYSQL_USER: ${DB_USER:-shopease_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shopease_password}
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shopease-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopease-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: ${APP_NAME:-ShopEase-Auth-Service}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8001
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-shopease_user}
      DB_PASSWORD: ${DB_PASSWORD:-shopease_password}
      DB_NAME: ${DB_NAME:-shopease_auth_db}
      DATABASE_URL: mysql+pymysql://${DB_USER:-shopease_user}:${DB_PASSWORD:-shopease_password}@auth-db:3306/${DB_NAME:-shopease_auth_db}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkey_change_in_production_1234567890!@#$%}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-customer}
    depends_on:
      auth-db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"
    networks:
      - shopease-network

volumes:
  auth_db_data:
    driver: local

networks:
  shopease-network:
    driver: bridge
